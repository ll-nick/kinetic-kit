name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Check formatting
        run: mise run format:check

      - name: Run tests
        run: mise run test

      - name: Build PDFs
        run: mise run build

      - name: Assemble Typst Universe package
        run: mise run package

      - name: Verify Typst Universe package
        run: mise run package:verify

      - name: Rename template PDF
        run: cp template/main.pdf template/template.pdf

      - name: Upload example PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: |
            examples/*.pdf
            template/template.pdf

      - name: Upload API reference
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: docs/api-reference.pdf

      - name: Upload Typst Universe package
        uses: actions/upload-artifact@v7
        with:
          name: universe-package
          path: dist/
