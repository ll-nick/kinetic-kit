name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Check formatting
        run: mise run format:check

      - name: Run tests
        run: mise run test

      - name: Build PDFs
        run: mise run build

      - name: Assemble Typst Universe submission
        run: mise run package

      - name: Verify Typst Universe submission
        run: mise run package:verify

      - name: Rename template PDF
        run: cp template/main.pdf template/template.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: |
            docs/api-reference.pdf
            examples/*.pdf
            template/template.pdf

      - name: Upload Typst Universe submission
        uses: actions/upload-artifact@v7
        with:
          name: universe-submission
          path: dist/
