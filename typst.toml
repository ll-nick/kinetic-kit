[package]
name = "kinetic-kit"
version = "0.1.0"
compiler = "0.14.2"
repository = "https://github.com/ll-nick/kinetic-kit"
entrypoint = "lib.typ"
description = "Dissertation (KSP-approved) and thesis at Karlsruhe Institute of Technology (KIT)."
authors = ["Nick Le Large <https://github.com/ll-nick>"]
license = "MIT-0"
categories = ["thesis"]
disciplines = ["engineering", "computer-science"]
keywords = ["dissertation", "doctoral", "thesis", "karlsruhe", "kit", "ksp"]

# Kept in the repository but left out of the compiler-downloaded package bundle.
exclude = [
    "/.claude/",
    "/.github/",
    "/.gitignore",
    "/CLAUDE.md",
    "/docs/",
    "/examples/",
    "/fonts/",
    "/guidelines.md",
    "/mise/",
    "/mise.toml",
    "/template/main.pdf",
    "/tests/",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail/thumbnail.png"
